<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Campbell Cloud</title>
<script>try{var t=localStorage.getItem('cc-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Campbell Cloud">
<link rel="icon" type="image/svg+xml" href="%FAVICON%">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* Brand tokens: see docs/brand/README.md. Light by default, dark when the system asks, unless the toggle picked one. */
:root{--bg:#ffffff;--fg:#0e0e10;--muted:#6e6e73;--card:#f4f4f5;--line:#e4e4e7;--accent:#2f5bff;color-scheme:light}
:root[data-theme=dark]{--bg:#0b0c0f;--fg:#f2f2f2;--muted:#8a8a90;--card:#15161a;--line:#232429;--accent:#7c9bff;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0c0f;--fg:#f2f2f2;--muted:#8a8a90;--card:#15161a;--line:#232429;--accent:#7c9bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:400}
.page{max-width:1080px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:clamp(36px,7vw,72px);min-height:100vh;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font-weight:500;font-size:20px;letter-spacing:-.02em}
.brand .slash{color:var(--accent)}
.theme{appearance:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;height:36px;padding:0 14px;font:inherit;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.theme:hover{color:var(--fg)}
.hero{display:flex;flex-direction:column;gap:14px}
.hero .kicker{color:var(--accent);font-size:13px}
.hero h1{margin:0;font-weight:500;font-size:clamp(36px,7vw,72px);line-height:1.02;letter-spacing:-.045em}
.sections{display:flex;flex-direction:column;gap:clamp(36px,6vw,56px)}
section{display:flex;flex-direction:column;gap:18px}
section h2{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);text-transform:lowercase}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:clamp(16px,3vw,28px)}
a.game{display:flex;flex-direction:column;gap:10px;color:var(--fg);text-decoration:none}
a.game .art{aspect-ratio:1;border-radius:22%;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--line);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
a.game .art svg{width:100%;height:100%;display:block}
a.game:hover .art{transform:translateY(-3px)}
a.game:active .art{transform:scale(.97)}
a.game .name{font-weight:500;font-size:17px;letter-spacing:-.01em}
a.game .where{font-size:11px;color:var(--muted);margin-top:-6px}
footer{margin-top:auto;display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted);padding-top:20px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="page">
<header>
  <a class="brand" href="./" aria-label="Campbell Cloud">%LOGO%<span>campbell<span class="slash">/</span>cloud</span></a>
  <button class="theme mono" type="button" aria-label="Switch light or dark"><span class="theme-label">theme</span></button>
</header>
<main class="sections">
  <div class="hero"><span class="kicker mono">// campbellcloud.com</span><h1>Things we make,<br>play and keep.</h1></div>
  %SECTIONS%
</main>
<footer class="mono"><span>© 2026 campbell/cloud</span></footer>
</div>
<script type="module" src="./landing.ts"></script>
</body>
</html>
