<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campbell Cloud</title>
<meta name="theme-color" content="#1b3a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campbell Cloud">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0%,#4aa3ec,#1b3a63 70%);font-family:"Arial Rounded MT Bold","Nunito",system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:clamp(28px,6vmin,56px);letter-spacing:.02em;text-shadow:0 4px 0 #0005}
.cloud + h1{margin-bottom:1vmin}
section{width:100%;max-width:1100px;display:flex;flex-direction:column;align-items:center;gap:2.5vmin;padding:2vmin 0}
section + section{border-top:3px dashed #ffffff40;padding-top:4vmin}
.sections{width:100%;display:flex;flex-direction:column;align-items:center;gap:3vmin}
h2{margin:0;font-size:clamp(20px,4vmin,34px);letter-spacing:.04em;text-transform:uppercase;opacity:.9;text-shadow:0 3px 0 #0005}
.games{display:flex;flex-wrap:wrap;gap:5vmin;justify-content:center;width:100%}
a.game{display:flex;flex-direction:column;align-items:center;gap:12px;text-decoration:none;color:#fff;width:min(36vmin,300px)}
a.game .art{width:100%;aspect-ratio:1;border-radius:22%;overflow:hidden;border:6px solid #000;box-shadow:0 10px 0 #0008;transition:transform .15s}
a.game:active .art{transform:translateY(6px) scale(.97);box-shadow:0 4px 0 #0008}
a.game .art svg{width:100%;height:100%;display:block}
a.game span{font-size:clamp(20px,4.2vmin,36px);font-weight:900;text-shadow:0 3px 0 #0006;text-align:center}
.cloud{font-size:clamp(40px,10vmin,90px);line-height:1}
@media (min-aspect-ratio:5/4){
  .sections{flex-direction:row;justify-content:center;align-items:stretch}
  section{width:auto;padding:0 4vmin}
  section + section{border-top:0;border-left:3px dashed #ffffff40;padding-top:0}
  .games{flex-wrap:nowrap;gap:4vmin}
  a.game{width:min(28vmin,19vw,260px)}
}
</style>
</head>
<body>
<main>
<div class="cloud">☁️</div>
<h1>Campbell Cloud</h1>
<div class="sections">%SECTIONS%</div>
</main>
<script type="module" src="./landing.ts"></script>
</body>
</html>
