<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Campbell Cloud</title>
<script>try{var t=localStorage.getItem('cc-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Campbell Cloud">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* Brand tokens: see docs/brand/README.md. Light by default, dark when the system asks, unless the toggle picked one. */
:root{--bg:#ffffff;--fg:#0e0e10;--muted:#6e6e73;--card:#f4f4f5;--line:#e4e4e7;--ring:#e4e4e7;--edge:#929296;--accent:#2f5bff;color-scheme:light;--t-xs:12px;--t-sm:15px;--t-md:19px;--t-display:clamp(32px,6vw,56px)}
:root[data-theme=dark]{--bg:#0b0c0f;--fg:#f2f2f2;--muted:#8a8a90;--card:#15161a;--line:#232429;--ring:#35363d;--edge:#5e5f66;--accent:#7c9bff;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0c0f;--fg:#f2f2f2;--muted:#8a8a90;--card:#15161a;--line:#232429;--ring:#35363d;--edge:#5e5f66;--accent:#7c9bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
/* Taps on the chrome and the tiles shouldn't start a text selection; the words themselves can still be copied. */
header,a.game,a.away{user-select:none;-webkit-user-select:none}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:400}
.page{max-width:1080px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:clamp(28px,6vw,64px);min-height:100vh;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font-weight:500;font-size:var(--t-md);letter-spacing:-.02em;border-radius:8px;outline:none}
.brand:focus-visible,.theme:focus-visible{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.brand .slash{color:var(--accent)}
.theme{appearance:none;border:1px solid var(--edge);background:none;color:var(--muted);border-radius:999px;width:44px;height:44px;padding:0;cursor:pointer;display:grid;place-items:center;outline:none}
.theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.theme .sun{display:none}
:root[data-theme=dark] .theme .sun{display:block}:root[data-theme=dark] .theme .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .theme .sun{display:block}:root:not([data-theme=light]) .theme .moon{display:none}}
.theme:hover{color:var(--fg)}
.hero h1{margin:0;text-wrap:balance;font-weight:500;font-size:var(--t-display);line-height:1.05;letter-spacing:-.04em}
.sections{display:flex;flex-direction:column;gap:clamp(36px,6vw,56px)}
section{display:flex;flex-direction:column;gap:18px}
section h2{margin:0;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:var(--t-sm);color:var(--muted);text-transform:lowercase}
/* The games here: Learning Games and Just for Fun stand side by side on a laptop and stack on a phone, two big tiles across either way. Each tile is a
   subgrid so names and blurbs line up across a row even when a name wraps. */
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(36px,6vw,56px) clamp(16px,3vw,28px)}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(16px,3vw,28px)}
a.game{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:8px;align-content:start;color:var(--fg);text-decoration:none;outline:none}
a.game .art{aspect-ratio:1;border-radius:22%;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--ring);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
a.game .art svg{width:100%;height:100%;display:block}
a.game:hover .art{transform:translateY(-3px)}
a.game:active .art{transform:scale(.97)}
a.game .name,a.game .blurb{transition:opacity .15s}
a.game:active .name,a.game:active .blurb{opacity:.6}
a.game:focus-visible .art{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
a.game:focus-visible .name{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
a.game .name{font-weight:500;font-size:var(--t-md);line-height:1.25;letter-spacing:-.01em}
a.game .blurb{font-size:var(--t-sm);line-height:1.35;color:var(--muted)}
/* The family's sites elsewhere: a quieter list of rows, each with a small icon, what it is, where it goes, and an arrow out. */
.rows{list-style:none;margin:-18px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));column-gap:clamp(16px,3vw,28px)}
a.away{display:grid;grid-template-columns:56px 1fr 20px;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none;outline:none}
a.away .art{width:56px;aspect-ratio:1;border-radius:22%;overflow:hidden;box-shadow:0 0 0 1px var(--ring)}
a.away .art svg{width:100%;height:100%;display:block}
a.away .text{display:flex;flex-direction:column;gap:2px;min-width:0}
a.away .name{font-weight:500;font-size:var(--t-sm);letter-spacing:-.01em}
a.away .blurb{font-size:var(--t-sm);color:var(--muted);line-height:1.35}
a.away .where{font-size:var(--t-xs);color:var(--muted)}
a.away .out{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s cubic-bezier(.2,.8,.2,1),stroke .15s}
a.away:hover .out{stroke:var(--fg);transform:translate(2px,-2px)}
a.away:active{opacity:.6}
a.away:focus-visible .art{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
a.away:focus-visible .name{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
/* Pale tile art would glare on the dark page, so in dark it swaps its tint for a deep one of the same hue. */
:root[data-theme=dark] .art .tint{fill:var(--dark)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .art .tint{fill:var(--dark)}}
footer{margin-top:auto;display:flex;justify-content:space-between;gap:12px;font-size:var(--t-xs);color:var(--muted);padding-top:20px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="page">
<header>
  <a class="brand" href="./" aria-label="Campbell Cloud">%LOGO%<span>campbell<span class="slash">/</span>cloud</span></a>
  <button class="theme" type="button" aria-label="Switch to dark"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
</header>
<main class="sections">
  <div class="hero"><h1>The family workshop, always open.</h1></div>
  %SECTIONS%
</main>
<footer class="mono"><span>© 2026 campbell/cloud</span></footer>
</div>
<script type="module" src="./landing.ts"></script>
</body>
</html>
