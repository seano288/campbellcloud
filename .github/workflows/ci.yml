name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run typecheck:pairings
      - run: npx vitest run
      - run: npm run build:site
      - run: npx wrangler deploy --dry-run --outdir dist-worker
