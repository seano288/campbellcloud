<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robot Combat P7</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.3 ui-monospace,Menlo,monospace;color:#cfd3d6;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#bug,#tag,#ko,#hud,.btn,#load{z-index:2}
#bug{position:fixed;left:24px;top:20px;width:230px;font:700 12px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.08em;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
#bug div{display:flex;align-items:center;gap:8px;margin-bottom:6px}#bug b{width:62px}#bug u{flex:1;height:7px;background:#fff2;display:block}#bug i{display:block;height:100%;transform-origin:left;background:#2f7bff}#a i{background:#e13a2c}
#tag{position:fixed;right:24px;top:20px;font:700 12px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;color:#fff;padding:5px 8px;background:#0008;pointer-events:none}#tag.rep{background:#c9321f}
#ko{position:fixed;left:0;right:0;top:66%;text-align:center;font:800 min(5.4vw,58px)/1.1 "Helvetica Neue",Arial,sans-serif;color:#fff;letter-spacing:.03em;opacity:0;transition:opacity .25s;text-shadow:0 2px 16px #000;pointer-events:none}#ko.on{opacity:1}
#ko small{display:block;font-size:.42em;font-weight:600;letter-spacing:.12em;margin-top:6px;color:#ffb36b}
#hud{position:fixed;left:24px;bottom:12px;opacity:.72;pointer-events:none;white-space:pre;text-shadow:0 1px 2px #000}
.btn{position:fixed;background:#0009;color:#fff;border:1px solid #fff5;border-radius:10px;font:600 14px/1 "Helvetica Neue",Arial,sans-serif;padding:12px 16px}
#replay{right:20px;bottom:18px}#fire{right:20px;bottom:70px;width:92px;height:92px;border-radius:50%;background:#d8541dcc;border:3px solid #ffd6b3;font-size:19px;font-weight:800}
body.rec .btn,body.rec #hud,body.shot #hud,body.shot .btn,body.shot #bug,body.shot #tag,body.shot #ko{display:none}
#load{position:fixed;inset:0;display:grid;place-items:center;font:600 15px "Helvetica Neue",Arial,sans-serif;color:#aab;pointer-events:none}
</style></head>
<body><div id="load">Warming up the arena</div>
<div id="bug"><div id="t"><b>TORQUE</b><u><i></i></u></div><div id="a"><b>ANVIL</b><u><i></i></u></div></div>
<div id="tag">LIVE</div><div id="ko"></div><div id="hud"></div>
<button id="fire" class="btn">FIRE</button><button id="replay" class="btn">Again</button>
<script type="module" src="/src/main.js"></script></body></html>
