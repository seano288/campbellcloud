<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#020615;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style>
<canvas id="c"></canvas>
<script>
// Deep Light Dive rendering prototype: which way of drawing the dark is cheap enough for an iPad 9?
const q = new URLSearchParams(location.search), MODE = q.get('mode') || 'A', DPR = Math.min(2, Number(q.get('dpr') || devicePixelRatio || 1));
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H; function size() { W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR); c.width = W; c.height = H; makeLayers(); }
let dark, dctx, bg, glowSprite; const LOW = MODE === 'B' ? 4 : 1;
function makeLayers() {
  dark = document.createElement('canvas'); dark.width = Math.ceil(W / LOW); dark.height = Math.ceil(H / LOW); dctx = dark.getContext('2d');
  bg = document.createElement('canvas'); bg.width = W; bg.height = H; const b = bg.getContext('2d');
  const g = b.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0c3a6b'); g.addColorStop(1, '#03081c'); b.fillStyle = g; b.fillRect(0, 0, W, H);
  b.fillStyle = '#1a2a3a'; for (let i = 0; i < 30; i++) { b.beginPath(); b.ellipse(Math.random() * W, H - Math.random() * 60 * DPR, 80 * DPR, 30 * DPR, 0, 0, 7); b.fill(); }
  glowSprite = document.createElement('canvas'); glowSprite.width = glowSprite.height = 64; const s = glowSprite.getContext('2d');
  const rg = s.createRadialGradient(32, 32, 0, 32, 32, 32); rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(.3, 'rgba(255,255,255,.5)'); rg.addColorStop(1, 'rgba(255,255,255,0)'); s.fillStyle = rg; s.fillRect(0, 0, 64, 64);
}
addEventListener('resize', size); size();
const fish = Array.from({ length: 24 }, (_, i) => ({ x: Math.random(), y: Math.random(), v: (Math.random() - .5) * .05, hue: ['#3ff','#9f3','#f4c','#fd4'][i % 4], glow: i % 2 === 0 }));
const motes = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random() }));
let t0 = performance.now(), last = t0; window.__work = []; window.__frames = [];
function drawFish(f, x, y, k) {
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.fillStyle = '#ffb84a'; ctx.strokeStyle = '#111'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(0, 0, 40, 26, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-36, 0); ctx.lineTo(-64, -20); ctx.lineTo(-64, 20); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(18, -6, 9, 0, 7); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(20, -6, 4.5, 0, 7); ctx.fill();
  ctx.restore();
}
function frame(now) {
  const dt = (now - last) / 1000; last = now; window.__frames.push(dt * 1000);
  const w0 = performance.now(), t = (now - t0) / 1000;
  const sx = W * (.5 + .3 * Math.cos(t * .7)), sy = H * (.5 + .25 * Math.sin(t)), ang = t * .6, reach = 520 * DPR, half = .45;
  ctx.drawImage(bg, 0, 0);
  ctx.fillStyle = 'rgba(180,220,255,.5)'; for (const m of motes) { ctx.fillRect(((m.x + t * .01) % 1) * W, m.y * H, 3 * DPR, 3 * DPR); }
  for (const f of fish) { f.x = (f.x + f.v * dt + 1) % 1; drawFish(f, f.x * W, f.y * H, DPR * .8); }
  // the sub
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(sx, sy, 70 * DPR, 40 * DPR, 0, 0, 7); ctx.fill();
  const tip = (r, a) => [sx + Math.cos(a) * r, sy + Math.sin(a) * r];
  if (MODE === 'A' || MODE === 'B') {
    const s = 1 / LOW; dctx.setTransform(s, 0, 0, s, 0, 0); dctx.globalCompositeOperation = 'source-over';
    dctx.fillStyle = 'rgba(2,6,21,.94)'; dctx.fillRect(0, 0, W, H);
    dctx.globalCompositeOperation = 'destination-out';
    const g = dctx.createRadialGradient(sx, sy, 20 * DPR, sx, sy, reach); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.7, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.moveTo(sx, sy); dctx.arc(sx, sy, reach, ang - half, ang + half); dctx.closePath(); dctx.fill();
    const g2 = dctx.createRadialGradient(sx, sy, 0, sx, sy, 140 * DPR); g2.addColorStop(0, 'rgba(0,0,0,.8)'); g2.addColorStop(1, 'rgba(0,0,0,0)'); dctx.fillStyle = g2; dctx.fillRect(sx - 140 * DPR, sy - 140 * DPR, 280 * DPR, 280 * DPR);
    ctx.drawImage(dark, 0, 0, W, H);
  } else if (MODE === 'C') {
    // one dark fill with the cone cut out (evenodd), then soft edges drawn as a gradient inside the cone
    ctx.fillStyle = 'rgba(2,6,21,.94)'; ctx.beginPath(); ctx.rect(0, 0, W, H);
    ctx.moveTo(sx, sy); const [ax, ay] = tip(reach, ang - half); ctx.lineTo(ax, ay); ctx.arc(sx, sy, reach, ang - half, ang + half); ctx.closePath();
    ctx.fill('evenodd');
    const g = ctx.createRadialGradient(sx, sy, reach * .5, sx, sy, reach); g.addColorStop(0, 'rgba(2,6,21,0)'); g.addColorStop(1, 'rgba(2,6,21,.94)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.arc(sx, sy, reach, ang - half, ang + half); ctx.closePath(); ctx.fill();
  }
  // glows on top, additive
  ctx.globalCompositeOperation = 'lighter';
  for (const f of fish) if (f.glow) { ctx.globalAlpha = .7; ctx.drawImage(glowSprite, f.x * W - 40 * DPR, f.y * H - 40 * DPR, 80 * DPR, 80 * DPR); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // sonar ring and outlines
  const r = Math.max(1, ((Math.max(0, t) % 2.5) / 2.5) * 900 * DPR); ctx.strokeStyle = 'rgba(80,255,200,.5)'; ctx.lineWidth = 3 * DPR; ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.stroke();
  window.__work.push(performance.now() - w0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
